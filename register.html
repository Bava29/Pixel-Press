<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>PixelPress</title>

    <meta name="description"
        content="PixelPress is a modern print and copy shop offering business cards, flyers, brochures, banners, document printing, and custom print solutions.">

    <meta name="keywords"
        content="print shop, printing services, business cards, flyers, brochures, banners, document printing">

    <meta name="author" content="PixelPress">

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--=========================================
Register Section Start
==========================================-->

    <section class="auth-page">

        <!-- Top Controls -->

        <div class="auth-top">

            <button class="theme-toggle-button">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button class="direction-toggle-button">

                <i class="fa-solid fa-right-left"></i>

            </button>

        </div>

        <div class="auth-card">

            <!-- Logo -->

                    <a href="index.html" class="auth-brand">

                <img src="images/logo.png" alt="PixelPress">

            </a>

            <!-- Heading -->

            <div class="auth-heading">

                <h2>Create Account</h2>

                <p>

                    Create your PixelPress account manage all your printing projects in one place.

                </p>

            </div>

            <!-- Register Form -->

            <form action="#">

                <div class="field-group">

                    <label>Full Name</label>

                    <input type="text" placeholder="Enter your full name">

                </div>

                <div class="field-group">

                    <label>Email Address</label>

                    <input type="email" placeholder="Enter your email">

                </div>

                <div class="field-group">

                    <label>Phone Number</label>

                    <input type="tel" placeholder="Enter your phone number">

                </div>

                <div class="field-group">

                    <label>Password</label>

                    <div class="password-input-field">

                        <input type="password" placeholder="Create a password">

                        <span class="password-visibility-toggle">

                            <i class="fa-regular fa-eye"></i>

                        </span>

                    </div>

                </div>

                <div class="field-group">

                    <label>Confirm Password</label>

                    <div class="password-input-field">

                        <input type="password" placeholder="Confirm your password">

                        <span class="password-visibility-toggle">

                            <i class="fa-regular fa-eye"></i>

                        </span>

                    </div>

                </div>

                <div class="auth-form-options">

                    <label>

                        <input type="checkbox">

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <button class="brand-solid-button">

                    Create Account

                </button>

            </form>

            <!-- Divider -->

            <div class="auth-divider">

                <span>

                    Or Continue With

                </span>

            </div>

            <!-- Social Login -->

            <div class="social-signin-links">

                <a href="#" class="google-signin">

                    <img src="images/google-logo.svg" alt="Google">

                </a>

                <a href="#" class="facebook-signin">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>

                <a href="#" class="apple-signin">

                    <i class="fa-brands fa-apple"></i>

                </a>

            </div>

            <!-- Bottom -->

            <div class="auth-bottom">

                <p>

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </section>

    <!--=========================================
Register Section End
==========================================-->


    <!-- Main JS -->
    <script src="js/main.js"></script>

</body>

</html>
