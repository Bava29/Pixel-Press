<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>PixelPress</title>

    <meta name="description"
        content="PixelPress is a modern print and copy shop offering business cards, flyers, brochures, banners, document printing, and custom print solutions.">

    <meta name="keywords"
        content="print shop, printing services, business cards, flyers, brochures, banners, document printing">

    <meta name="author" content="PixelPress">

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--=========================================
Login Section Start
==========================================-->

    <section class="auth-page">

        <!-- Top Controls -->

        <div class="auth-top">

            <button class="theme-toggle-button">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button class="direction-toggle-button">

                <i class="fa-solid fa-right-left"></i>

            </button>

        </div>

        <div class="site-container">

            <div class="auth-card">

                <!-- Logo -->

                    <a href="index.html" class="auth-brand">

                    <img src="images/logo.png" alt="PixelPress">

                </a>

                <!-- Heading -->

                <div class="auth-heading">

                    <h2>Welcome Back</h2>

                    <p>

                        Sign in to your PixelPress account and manage your printing projects with ease.

                    </p>

                </div>

                <!-- Login Form -->

                <form action="#">

                    <div class="field-group">

                        <label>Email Address</label>

                        <input type="email" placeholder="Enter your email">

                    </div>

                    <div class="field-group password-input-group">

                        <label>Password</label>

                        <div class="password-input-field">

                            <input type="password" placeholder="Enter your password">

                            <span class="password-visibility-toggle">

                                <i class="fa-regular fa-eye"></i>

                            </span>

                        </div>

                    </div>

                    <div class="auth-form-options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">

                            Forgot Password?

                        </a>

                    </div>

                    <button class="brand-solid-button">

                        Login

                    </button>

                </form>

                <!-- Divider -->

                <div class="auth-divider">

                    <span>Or Continue With</span>

                </div>

                <!-- Social Login -->

                <div class="social-signin-links">

                    <a href="#" class="google-signin">

                        <img src="images/google-logo.svg" alt="Google">

                    </a>

                    <a href="#" class="facebook-signin">

                        <i class="fa-brands fa-facebook-f"></i>

                    </a>

                    <a href="#" class="apple-signin">

                        <i class="fa-brands fa-apple"></i>

                    </a>
                </div>

                <!-- Register -->

                <div class="auth-bottom">

                    <p>

                        Don't have an account?

                        <a href="register.html">

                            Create Account

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>

    <!--=========================================
Login Section End
==========================================-->

    <!-- Main JS -->
    <script src="js/main.js"></script>

</body>

</html>
